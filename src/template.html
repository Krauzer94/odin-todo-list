<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOP - Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="container">

    <!-- Header bar -->
    <header>
      <h1>Odin Todo List</h1>
    </header>

    <!-- Projects sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projects</h2>
        <button class="add-project">ADD</button>
      </div>
      <div class="sidebar-projects">
        <div>Default Project</div>
      </div>
    </aside>

    <!-- Tasks content -->
    <main id="content"></main>

    <!-- Modal to add or edit a task -->
    <dialog class="add-task-dialog" id="addTaskDialog">
      <form class="add-task-form">
        <div class="dialog-header">
          <button class="close-modal-btn" id="closeModalBtn" type="button">×</button>
        </div>

        <!-- Task information fields -->
        <div class="add-task-fields">

          <!-- Title input -->
          <div class="task-title-field">
            <label for="taskTitle">Title</label>
            <input id="taskTitle" name="taskTitle" type="text" required>
          </div>

          <!-- Description input -->
          <div class="task-description-field">
            <label for="taskDescription">Description</label>
            <input id="taskDescription" name="taskDescription" type="text">
          </div>

          <!-- Due date input -->
          <div class="task-duedate-field">
            <label for="taskDuedate">Due date</label>
            <input id="taskDuedate" name="taskDuedate" type="date">
          </div>

          <!-- Priority: low, medium or high -->
          <div class="task-priority-field">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" name="taskPriority" required>
              <option value="" disabled selected>
                How important is this task?
              </option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <!-- Cancel/Confirm buttons -->
          <div class="add-task-btns-field">
            <button class="cancel-btn" id="cancelBtn" type="button">Cancel</button>
            <button class="confirm-btn" id="confirmBtn" value="default">Confirm</button>
          </div>

      </form>
    </dialog>

    <!-- Modal for task details -->
    <dialog class="task-details-dialog" id="taskDetailsDialog">
      <div class="task-details-content">
        <div class="dialog-header">
          <button class="close-modal-btn" id="closeDetailsBtn" type="button">×</button>
        </div>

        <!-- Task information fields -->
        <div class="task-details-fields">

          <!-- Title field -->
          <div class="task-title-field">
            <label>Title</label>
            <p id="detailsTitle"></p>
          </div>

          <!-- Description field -->
          <div class="task-description-field">
            <label>Description</label>
            <p id="detailsDescription"></p>
          </div>

          <!-- Due date field -->
          <div class="task-duedate-field">
            <label>Due date</label>
            <p id="detailsDueDate"></p>
          </div>

          <!-- Priority field -->
          <div class="task-priority-field">
            <label>Priority</label>
            <p id="detailsPriority"></p>
          </div>

          <!-- Cancel dialog button -->
          <div class="add-task-btns-field">
            <button class="cancel-btn" id="detailsCancelBtn" type="button">Cancel</button>
          </div>
        </div>

      </div>
    </dialog>

    <!-- Copyright footer -->
    <footer>
      <p>Copyright © 2026 | <a class="copyright-link" href="https://github.com/Krauzer94/odin-todo-list" target="_blank">Krauzer94</a></p>
    </footer>

  </div>
</body>

</html>
